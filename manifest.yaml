version: v1
build:
  os: centos7
  tools:
    node: "22"
  run:
    workDir: .
    cmd:
      - npm ci --no-audit --no-fund
      - npm ci --prefix ops/catpaw --no-audit --no-fund
      - npm run build
  target:
    distDir: .
    files:
      - ./*
      - ./.next

autodeploy:
  hulkos: centos7
  targetDir: /opt/meituan/apps/log-note
  tools:
    node: "22"
  run: ./ops/start-cargo.sh
  check: curl -sf http://localhost:3100/api/healthz || exit 1
  checkRetry: 30
  checkInterval: 5s
  daemonToolsStopTimeout: 60s
