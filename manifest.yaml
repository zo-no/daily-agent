version: v1
build:
  os: centos7
  tools:
    node: "20"
  run:
    workDir: .
    cmd:
      - npm ci --no-audit --no-fund
      - npm run build
  target:
    distDir: .
    files:
      - ./*

autodeploy:
  hulkos: centos7
  targetDir: /opt/meituan/apps/log-note
  tools:
    node: "20"
  run: source ~/.bashrc && npm run start
  check: curl -sf http://localhost:3100/api/healthz || exit 1
  checkRetry: 30
  checkInterval: 5s
  daemonToolsStopTimeout: 60s
