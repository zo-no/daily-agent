version: v1
common:
  os: mtos
build:
  os: mtos
  tools:
    dp-nodejs: "20"
  run:
    workDir: .
    cmd:
      - npm ci --no-audit --no-fund
      - npm run build
      - mkdir -p runtime
      - cp "$(command -v node)" runtime/node
  target:
    distDir: .
    files:
      - ./*

autodeploy:
  hulkos: mtos
  targetDir: /opt/meituan/apps/log-note
  run: ./runtime/node node_modules/next/dist/bin/next start -p 3100
  check: curl -sf http://localhost:3100/api/healthz || exit 1
  checkRetry: 30
  checkInterval: 5s
  daemonToolsStopTimeout: 60s
