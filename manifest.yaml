version: v1
common:
  os: mtos
build:
  os: mtos
  tools:
    dp-nodejs: "20"
  run:
    workDir: .
    cmd:
      - npm ci --no-audit --no-fund
      - npm run build
  target:
    distDir: .
    files:
      - ./*

autodeploy:
  hulkos: mtos
  targetDir: /opt/meituan/apps/log-note
  tools:
    dp-nodejs: "20"
  run: npm run start
  check: curl -sf http://localhost:3100/api/healthz || exit 1
  checkRetry: 30
  checkInterval: 5s
  daemonToolsStopTimeout: 60s
